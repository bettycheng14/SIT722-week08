name: 05 - Monitoring

on:
  workflow_run:
    workflows:
      - "04 - Deploy to Production"
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "monitoring/**"
  workflow_dispatch:

jobs:
  monitoring:
    name: Deploy and validate Prometheus and Grafana
    runs-on: ubuntu-latest

    if: >
      ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install or upgrade kube-prometheus-stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            --values monitoring/kube-prometheus-stack-values.yaml \
            --wait --timeout 10m

      - name: Apply PodMonitor
        run: |
          kubectl apply -f monitoring/podmonitor-koalatech.yaml

      - name: Validate Grafana and Prometheus are running
        run: |
          kubectl rollout status deployment/prometheus-grafana -n monitoring --timeout=300s
          kubectl rollout status statefulset/prometheus-prometheus-kube-prometheus-prometheus -n monitoring --timeout=300s
          kubectl get pods -n monitoring

      - name: Validate Prometheus is scraping the application
        run: |
          QUERY='count(up{job="monitoring/koalatech-services"}==1)'
          for i in {1..20}; do
            RESULT=$(kubectl get --raw \
              "/api/v1/namespaces/monitoring/services/prometheus-kube-prometheus-prometheus:9090/proxy/api/v1/query?query=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$QUERY")" \
              | jq -r '.data.result[0].value[1] // "0"')
            echo "Healthy application targets: $RESULT"
            if [ "$RESULT" -gt 0 ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Prometheus is not scraping any KoalaTech pods"
          exit 1
